services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: trotamundos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d trotamundos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://trotamundos:trotamundos@postgres:5432/trotamundos?sslmode=disable
      OLAP_DATABASE_URL: postgres://trotamundos:trotamundos@postgres:5432/trotamundos?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL: 720h
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      MOCK_CONTROL_KEY: ${MOCK_CONTROL_KEY:-dev-mock-key}
      WEBHOOK_KEY: ${WEBHOOK_KEY:-dev-webhook-key}
      SEED_ANALYST_EMAIL: ${SEED_ANALYST_EMAIL:-analyst@trotamundos.dev}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:-analyst12345}
      CORS_ALLOWED_ORIGIN: "*"
      ENABLE_WORKERS: "true"
      INGESTION_POLL_INTERVAL: 2s
      PROVIDER_SYNC_INTERVAL: 1m
      AUTO_ARCHIVE_INTERVAL: 5m
    ports:
      - "8080:8080"
    volumes:
      - keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  keys:
